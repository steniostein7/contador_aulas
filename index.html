<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Aulas 2026 | ProfessorMG</title>
    <meta name="description" content="Calcule o total de aulas previstas para o trimestre SEE/MG 2026. Gere relatórios em PDF com datas e dias da semana organizados.">
    
    <link rel="shortcut icon" href="assets/img/favicon.png" type="image/x-icon">
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <meta property="og:title" content="Calculadora de Aulas Previstas - SEE/MG 2026">
    <meta property="og:description" content="Ferramenta gratuita para professores mineiros organizarem o Diário Digital e planos de curso.">
    <meta property="og:image" content="assets/img/preview-calculadora.png">
    <meta property="og:type" content="website">
    
    <!-- Bibliotecas Essenciais para PDF no Celular -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary: #6B3B6F; --secondary: #FF8A65; --bg: #f4f7f6; --success: #2e7d32; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: #333; margin: 0; padding: 15px; }
        
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { color: var(--primary); text-align: center; margin-bottom: 25px; font-size: 1.5rem; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.85rem; }
        select, input { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px; font-family: inherit; box-sizing: border-box; font-size: 1rem; }
        
        /* Grid Ajustado para Mobile */
        .grid-aulas { 
            display: grid; 
            grid-template-columns: repeat(5, 1fr); 
            gap: 8px; 
            margin-bottom: 20px; 
        }
        .day-input { display: flex; flex-direction: column; align-items: center; }
        .day-input label { font-size: 0.7rem; margin-bottom: 4px; color: #666; }
        .day-input input { text-align: center; padding: 10px 2px; }

        @media (max-width: 480px) {
            .grid-aulas { grid-template-columns: repeat(3, 1fr); gap: 10px; }
            .container { padding: 15px; }
        }

        button { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; margin-bottom: 10px; font-size: 1rem; }
        button:hover { background: #5a315e; transform: translateY(-2px); }
        
        .btn-limpar { background: #6c757d; }
        .btn-imprimir { background: #4b5563; margin-top: 15px; }
        
        .resultado-card { margin-top: 25px; padding: 15px; border-radius: 15px; background: #f0fdf4; border: 2px solid var(--success); display: none; }
        .total-aulas { font-size: 2.2rem; font-weight: 700; color: var(--success); display: block; text-align: center; margin: 10px 0; }
        
        table { width: 100%; margin-top: 15px; border-collapse: collapse; font-size: 0.8rem; }
        th { background: #eee; padding: 8px; text-align: left; }
        td { padding: 8px; border-bottom: 1px solid #eee; }
        
        .btn-remove { color: #ef4444; border: none; background: none; cursor: pointer; font-size: 1rem; width: auto; padding: 0; margin: 0; }

        .form-extra { margin-top: 15px; padding: 12px; border: 1px dashed var(--primary); border-radius: 10px; background: #fff; }

        /* Impressão via Navegador (Fallback) */
        @media print {
            h2, .form-group, .grid-aulas, button, label, .form-extra, .no-print { display: none !important; }
            .resultado-card { display: block !important; border: none; background: white; padding: 0; }
            table { font-size: 9pt; width: 100%; border: 1px solid #000; }
            th, td { border: 1px solid #000; padding: 4px; }
        }

         footer { margin-top: 50px; padding: 30px 20px; font-size: 0.8rem; color: #888; text-align: center; border-top: 1px solid #eee; }
        .social-links { margin-bottom: 15px; display: flex; justify-content: center; gap: 15px; }
        .social-btn { color: var(--primary); font-size: 1.2rem; text-decoration: none; }

        @media (max-width: 600px) {
            .menu-grid { grid-template-columns: 1fr; }
            .banner-ded { flex-direction: column; text-align: center; }
            .banner-content { flex-direction: column; }
            .btn-banner { width: 80%; margin: 0 auto; }
        }
    </style>
</head>
<body>

<div class="container">
    <h2><i class="fas fa-calculator"></i> Contador de Aulas 2026 | ProfessorMG</h2>
    <h4> <i>Informe a turma, selecione o trimestre e defina quantas aulas acontecem em cada dia da semana.</i> </h4>

    <div class="form-group">
        <label>Turma:</label>
        <input type="text" id="nomeTurma" placeholder="Ex: 9º Ano A">
    </div>
    
    <div class="form-group">
        <label>Selecione o trimestre:</label>
        <select id="trimestre">
            <option value="1">1º Trimestre (04/02 a 20/05)</option>
            <option value="2">2º Trimestre (21/05 a 09/09)</option>
            <option value="3">3º Trimestre (10/09 a 18/12)</option>
        </select>
    </div>

    <label>Aulas por dia da semana:</label>
    <div class="grid-aulas">
        <div class="day-input"><label>Seg</label><input type="number" id="seg" value="0"></div>
        <div class="day-input"><label>Ter</label><input type="number" id="ter" value="0"></div>
        <div class="day-input"><label>Qua</label><input type="number" id="qua" value="0"></div>
        <div class="day-input"><label>Qui</label><input type="number" id="qui" value="0"></div>
        <div class="day-input"><label>Sex</label><input type="number" id="sex" value="0"></div>
    </div>

    <button onclick="gerarContagem()"><i class="fas fa-sync"></i> Calcular aulas</button>
    <button onclick="limparTudo()" class="btn-limpar"><i class="fas fa-eraser"></i> Limpar Formulário</button>

    <div id="resultado" class="resultado-card">
        <p style="text-align:center; margin:0; font-size: 0.9rem;">Total de aulas previstas:</p>
        <span id="totalDisplay" class="total-aulas">0</span>
        
        <button onclick="imprimirResultado()" class="btn-imprimir"><i class="fas fa-file-pdf"></i> Baixar Relatório (PDF)</button>

        <div class="form-extra no-print">
            <p style="margin: 0 0 8px 0; font-weight: 600; font-size: 0.75rem; color: var(--primary);">+ Adicionar dia extra:</p>
            <div style="display: flex; gap: 5px;">
                <input type="date" id="extraData" style="flex: 2; font-size: 0.85rem; padding: 8px;">
                <input type="number" id="extraQtd" value="1" style="flex: 1; font-size: 0.85rem; padding: 8px;">
                <button onclick="adicionarDiaExtra()" style="flex: 1; padding: 8px; margin: 0; font-size: 0.75rem;">Adicionar dia extra</button>
            </div>
        </div>

        <table id="tabelaAulas">
            <thead>
                <tr>
                    <th>Data</th>
                    <th>Dia da Semana</th>
                    <th>Aulas</th>
                    <th class="no-print"></th>
                </tr>
            </thead>
            <tbody id="listaCorpo"></tbody>
        </table>
    </div>
</div>
     <footer>
        <div class="social-links">
            <a href="https://tiktok.com/@steniostein7" target="_blank" class="social-btn"><i class="fab fa-tiktok"></i></a>
            <a href="https://instagram.com/steniostein7" target="_blank" class="social-btn"><i class="fab fa-instagram"></i></a>
            <a href="mailto:steniostein7@gmail.com" class="social-btn"><i class="fas fa-envelope"></i></a>
        </div>
        <p>&copy; 2026 Professor MG | Tecbox Academy</p>
        <p>Desenvolvido com <i class="fas fa-heart" style="color: var(--secondary);"></i> para a educação mineira.</p>
    </footer>

<script src="script.js"></script>
</body>
</html>
