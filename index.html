<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contador de Aulas | Professor MG</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #6B3B6F; --secondary: #FF8A65; --bg: #f4f7f6; --success: #2e7d32; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: #333; margin: 0; padding: 15px; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h2 { color: var(--primary); text-align: center; margin-bottom: 25px; font-size: 1.5rem; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.85rem; }
        select, input { width: 100%; padding: 12px; border: 2px solid #eee; border-radius: 10px; font-family: inherit; box-sizing: border-box; font-size: 1rem; }
        
        .grid-aulas { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-bottom: 20px; }
        .day-input { display: flex; flex-direction: column; align-items: center; }
        .day-input label { font-size: 0.7rem; margin-bottom: 4px; color: #666; }
        .day-input input { text-align: center; padding: 10px 2px; }

        @media (max-width: 480px) {
            .grid-aulas { grid-template-columns: repeat(3, 1fr); gap: 10px; }
        }

        button { width: 100%; background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; margin-bottom: 10px; }
        .btn-limpar { background: #6c757d; }
        .btn-imprimir { background: #4b5563; margin-top: 15px; }
        
        .resultado-card { margin-top: 25px; padding: 15px; border-radius: 15px; background: #f0fdf4; border: 2px solid var(--success); display: none; }
        .total-aulas { font-size: 2.2rem; font-weight: 700; color: var(--success); display: block; text-align: center; margin: 10px 0; }
        
        table { width: 100%; margin-top: 15px; border-collapse: collapse; font-size: 0.8rem; }
        th { background: #eee; padding: 8px; text-align: left; }
        td { padding: 8px; border-bottom: 1px solid #eee; }
        .btn-remove { color: #ef4444; border: none; background: none; cursor: pointer; }
    </style>
</head>
<body>
    </body>
</html>
